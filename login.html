<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Login — Painel Renato Pinheiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-box">
        <h1>Renato Pinheiro</h1>
        <p class="subtitle">Painel Administrativo</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required autocomplete="email" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="Sua senha">
            </div>
            <div id="login-error" style="display:none; color: var(--erro); font-size: 0.85rem; margin-bottom: 12px;"></div>
            <button type="submit" class="btn btn-primary" style="width:100%" id="login-btn">Entrar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        (function() {
            var sb = getSupabase();
            if (!sb) {
                showConfigError(document.querySelector('.login-box'));
                return;
            }

            redirectIfLoggedIn();

            var form = document.getElementById('login-form');
            var errorEl = document.getElementById('login-error');
            var btn = document.getElementById('login-btn');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                errorEl.style.display = 'none';
                btn.disabled = true;
                btn.textContent = 'Entrando...';

                var email = document.getElementById('email').value.trim();
                var password = document.getElementById('password').value;

                var result = await sb.auth.signInWithPassword({ email: email, password: password });

                if (result.error) {
                    errorEl.textContent = 'E-mail ou senha incorretos.';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    return;
                }

                window.location.href = 'produtos.html';
            });
        })();
    </script>
</body>
</html>
