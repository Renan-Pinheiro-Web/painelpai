<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Produtos — Painel Renato Pinheiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="admin-header">
            <h1>Renato Pinheiro</h1>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </header>

        <div class="products-toolbar">
            <input type="text" class="search-input" id="search" placeholder="Buscar por nome...">
            <select id="filter-category">
                <option value="">Todas as categorias</option>
                <option value="Kits">Kits</option>
                <option value="Reparadores">Reparadores</option>
                <option value="Protetores térmicos">Protetores térmicos</option>
            </select>
            <select id="filter-visibility">
                <option value="">Visibilidade</option>
                <option value="visible">Visíveis</option>
                <option value="hidden">Ocultos</option>
            </select>
            <a href="produto-form.html" class="btn btn-primary">+ Novo produto</a>
        </div>

        <div id="product-list-container">
            <div class="state-loading">Carregando produtos...</div>
        </div>
    </div>

    <!-- Modal de confirmação -->
    <div id="delete-modal" class="modal-overlay" style="display:none">
        <div class="modal-box">
            <h3>Excluir produto</h3>
            <p>Tem certeza que deseja excluir <strong id="delete-product-name"></strong>? Isso também apagará todas as fotos do produto. Essa ação não pode ser desfeita.</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="delete-cancel">Cancelar</button>
                <button class="btn btn-danger" id="delete-confirm">Excluir</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="produtos.js"></script>
</body>
</html>
